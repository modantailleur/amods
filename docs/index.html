<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>AMODS — Granular Speech Masker</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎙️</text></svg>" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <h1>Granular Speech Masker</h1>

  <section class="panel">
    <h2>Audio devices</h2>
    <div class="device-row">
      <label for="mic-select">Mic (in)</label>
      <select id="mic-select"></select>
      <div class="level-bar"><div id="in-level-fill" class="level-fill"></div></div>
    </div>
    <div class="device-row">
      <label for="speaker-select">Speaker (out)</label>
      <select id="speaker-select"></select>
      <div class="level-bar"><div id="out-level-fill" class="level-fill"></div></div>
      <button id="ping-btn" type="button">Ping</button>
    </div>
    <p id="feedback-warning" class="warning"></p>
    <p id="output-sink-warning" class="warning"></p>
  </section>

  <div class="section-group">
    <div class="section-header">
      <label class="toggle-switch">
        <input type="checkbox" id="concealer-enabled-toggle" checked />
        <span class="toggle-slider"></span>
      </label>
      <h2 class="section-title">Concealer</h2>
    </div>
    <div class="panel-row concealer-dependent">
      <section class="panel concealer-controls-panel">
        <h2>Concealer controls</h2>
        <div class="row">
          <label for="vad-type-select">VAD</label>
          <select id="vad-type-select">
            <option value="ten" selected>TEN VAD</option>
            <option value="silero">Silero</option>
          </select>
        </div>
        <div class="row">
          <label for="denoiser-select">Denoiser</label>
          <select id="denoiser-select">
            <option value="none">None</option>
            <option value="int8" selected>FbDM dns64 — quantized (~50MB)</option>
            <option value="fbdedm">FbdeDM — de-esser + FbDM dns64</option>
          </select>
        </div>
        <div class="row">
          <label for="concealing-rate">Concealing likelihood</label>
          <input type="range" id="concealing-rate" min="0.1" max="0.9" step="0.1" value="0.5" />
          <span id="concealing-rate-value" class="value">0.5</span>
        </div>
        <div class="row">
          <label for="concealer-memory-rate">Concealing purity</label>
          <input type="range" id="concealer-memory-rate" min="0.1" max="0.9" step="0.1" value="0.8" />
          <span id="concealer-memory-rate-value" class="value">0.8</span>
        </div>
        <div class="row">
          <label for="concealing-smoothness">Concealing smoothness</label>
          <input type="range" id="concealing-smoothness" min="0" max="1" step="0.1" value="0.5" />
          <span id="concealing-smoothness-value" class="value">0.5</span>
        </div>
        <div class="row">
          <label for="concealing-overlap">Concealing overlap</label>
          <input type="range" id="concealing-overlap" min="0" max="1" step="0.5" value="0.5" />
          <span id="concealing-overlap-value" class="value">0.5</span>
        </div>
      </section>

      <section class="panel concealer-level-panel">
        <h2>Concealer level</h2>
        <div class="fader-row">
          <input type="range" id="conc-level" class="vertical-fader" min="-36" max="36" step="1" value="0" orient="vertical" />
          <span id="conc-level-value" class="value">+0 dB</span>
        </div>
      </section>
    </div>
  </div>

  <div class="section-group">
    <div class="section-header">
      <label class="toggle-switch">
        <input type="checkbox" id="noise-enabled-toggle" />
        <span class="toggle-slider"></span>
      </label>
      <h2 class="section-title">Noise</h2>
    </div>
    <div class="panel-row noise-dependent">
      <section class="panel noise-controls-panel">
        <h2>Noise controls</h2>
        <div class="row">
          <label for="noise-type-select">Type</label>
          <select id="noise-type-select">
            <option value="speechShaped" selected>Speech-shaped</option>
            <option value="white">White noise</option>
            <option value="pink">Pink noise</option>
          </select>
        </div>
        <div class="row noise-type-dependent">
          <label for="noise-vad-type-select">VAD</label>
          <select id="noise-vad-type-select">
            <option value="ten" selected>TEN VAD</option>
            <option value="silero">Silero</option>
          </select>
        </div>
        <div class="row noise-type-dependent">
          <label for="concealing-noise-sensitivity">Sensitivity</label>
          <input type="range" id="concealing-noise-sensitivity" min="0" max="1" step="0.1" value="0.5" />
          <span id="concealing-noise-sensitivity-value" class="value">0.5</span>
        </div>
        <div class="row noise-type-dependent">
          <label for="concealing-noise-purity">Speech-shaped purity</label>
          <input type="range" id="concealing-noise-purity" min="0" max="0.9" step="0.1" value="0.5" />
          <span id="concealing-noise-purity-value" class="value">0.5</span>
        </div>
      </section>

      <section class="panel noise-level-panel">
        <h2>Noise level</h2>
        <div class="fader-row">
          <input type="range" id="noise-level" class="vertical-fader" min="-36" max="36" step="1" value="0" orient="vertical" />
          <span id="noise-level-value" class="value">+0 dB</span>
        </div>
      </section>
    </div>
  </div>

  <p id="loading-message" class="status-text">Loading models…</p>
  <div id="loading-progress" class="progress-bar"><div id="loading-progress-fill" class="progress-fill"></div></div>
  <div class="transport-row">
    <button id="start-stop-btn" disabled title="Start" aria-label="Start">▶</button>
    <button id="stop-btn" disabled title="Stop" aria-label="Stop">⏹</button>
  </div>

  <section class="status-panel">
    <div class="row"><span>Progress:</span><span id="progress">—</span></div>
    <div class="row"><span>Latency:</span><span id="latency">—</span></div>
    <p id="status" class="status-text">Idle — press ▶ to begin</p>
  </section>

  <script type="module" src="js/main.js"></script>
</body>
</html>
