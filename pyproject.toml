[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "amods"
version = "0.1.2"
description = "Adaptive Masking of Distracting Speech (AMODS)"
readme = "README.md"
requires-python = "==3.11.15"
license = { file = "LICENSE" }
authors = [
    { name = "Modan Tailleur" },
    { name = "Aine Drelingyte" },
    { name = "Clara Boukhemia" },
    { name = "Mathieu Lagrange" },
    { name = "Romain Serizel" },
    { name = "Nicolas Misdariis" },
]
maintainers = [{ name = "Modan Tailleur", email = "modan.tailleur@gmail.com" }]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Topic :: Multimedia :: Sound/Audio",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "numpy==2.4.6",
    "librosa==0.11.0",
    "soundfile==0.13.1",
    "sounddevice==0.5.5",
    "PyYAML==6.0.3",
    "torch==2.11.0",
    "denoiser==0.1.5",
    "ten_vad==1.0.6.8",
    "silero-vad==6.2.1",
    "webrtcvad==2.0.10",
]

[project.optional-dependencies]
gui = []
dev = ["pytest==9.1.1"]

[project.scripts]
amods = "amods.cli:main"
amods-gui = "amods.gui:main"
amods-latency = "amods.latency:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"amods.configs" = ["**/*.yaml"]
