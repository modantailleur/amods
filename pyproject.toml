[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "amods"
version = "0.1.5"
description = "Adaptive Masking of Distracting Speech (AMODS)"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = { file = "LICENSE" }
authors = [
    { name = "Modan Tailleur" },
    { name = "Aine Drelingyte" },
    { name = "Clara Boukhemia" },
    { name = "Mathieu Lagrange" },
    { name = "Romain Serizel" },
    { name = "Nicolas Misdariis" },
]
maintainers = [{ name = "Modan Tailleur", email = "modan.tailleur@gmail.com" }]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Topic :: Multimedia :: Sound/Audio",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "numpy>=2.0,<3",
    # librosa<0.10.2 imports pkg_resources (deprecated, and past setuptools's
    # announced pkg_resources removal-eligible date), which isn't guaranteed
    # present on every interpreter - 0.10.2 dropped that import entirely.
    "librosa>=0.10.2,<0.12",
    "soundfile>=0.12.1,<0.14",
    "sounddevice>=0.4,<0.6",
    "PyYAML>=6.0,<7",
    # torch<2.3 can't interoperate with numpy>=2.0 (torch.from_numpy raises
    # "RuntimeError: Numpy is not available") on any platform - verified
    # empirically (2.0.0 and 2.2.0 both fail). torch==2.3.0 fixes this on
    # Linux/macOS but NOT on Windows (confirmed via real Windows CI, not
    # locally - there's no way to run Windows binaries from this machine);
    # 2.5.0 is a safety-margin bump pending that CI confirming it's actually
    # fixed there too.
    "torch>=2.5.0,<3",
    "denoiser>=0.1.5,<0.2",
    # ten_vad<1.0.6.5's wheel is mistagged py3-none-any but actually bundles
    # a Linux-only compiled .so - it fails to import at all on Windows/macOS.
    # 1.0.6.5 is the first release that properly bundles binaries for all
    # three platforms.
    "ten_vad>=1.0.6.5,<1.1",
    "silero-vad>=5.1,<7",
    # webrtcvad's C extension hard-codes WEBRTC_POSIX in its build and has
    # never published a Windows wheel across its entire version history - it
    # isn't written to compile there. Excluded on Windows; amods.models.vad
    # already imports it lazily and the "webrtc" VAD type just isn't
    # available there (use "silero" or "ten" instead).
    "webrtcvad>=2.0.7,<3; sys_platform != 'win32'",
    "onnxruntime>=1.18.0,<2",
]

[project.optional-dependencies]
gui = []
dev = ["pytest>=7.0,<10"]

[project.scripts]
amods = "amods.cli:main"
amods-gui = "amods.gui:main"
amods-latency = "amods.latency:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"amods.configs" = ["**/*.yaml"]
