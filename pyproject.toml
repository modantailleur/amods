[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "amods"
version = "0.1.9"
description = "Adaptive Masking of Distracting Speech (AMODS)"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = "MIT"
authors = [
    { name = "Modan Tailleur" },
    { name = "Aine Drelingyte" },
    { name = "Clara Boukhemia" },
    { name = "Mathieu Lagrange" },
    { name = "Romain Serizel" },
    { name = "Nicolas Misdariis" },
]
maintainers = [{ name = "Modan Tailleur", email = "modan.tailleur@gmail.com" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Topic :: Multimedia :: Sound/Audio",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    # 1.26.4 satisfies every transitive floor (onnxruntime>=1.24.2,
    # scikit-learn>=1.22, numba>=1.22) and is the first 1.x release with a
    # cp312 wheel (1.24.x/1.25.x predate Python 3.12). Deliberately not
    # raised to >=2.0 in general: amods's own code uses no numpy-2.0-only
    # API, and a >=2.0 floor would force torch>=2.3 (see the torch entry
    # below), which has no macOS x86_64 (Intel) wheel at all - torch is
    # capped at 2.2.2 there by wheel availability alone, but numpy itself
    # still publishes 2.x wheels for that platform, so pip has no organic
    # reason to hold it back the way it does torch. Capped explicitly below
    # so the two never resolve to a mismatched, ABI-incompatible pair there.
    "numpy>=1.26.4,<2; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "numpy>=1.26.4,<3; sys_platform != 'darwin' or platform_machine != 'x86_64'",
    # librosa<0.10.2 imports pkg_resources (deprecated, and past setuptools's
    # announced pkg_resources removal-eligible date), which isn't guaranteed
    # present on every interpreter - 0.10.2 dropped that import entirely.
    "librosa>=0.10.2,<0.12",
    # numba isn't a direct amods dependency (librosa pulls it in), but it's
    # constrained here anyway: numba>=0.63.0 depends on a llvmlite release
    # with no macOS x86_64 (Intel) wheel, so it fails to build from source
    # there. 0.62.1 is the last numba release with wheels for every platform
    # amods supports.
    "numba<0.63",
    "soundfile>=0.12.1,<0.14",
    "sounddevice>=0.4,<0.6",
    "PyYAML>=6.0,<7",
    # torch<2.3 only interoperates with numpy<2 (torch.from_numpy raises
    # "RuntimeError: Numpy is not available" otherwise - verified empirically
    # on 2.0.0 and 2.2.0, and confirmed on real Windows CI too). Rather than
    # forcing numpy>=2.0 (and losing macOS x86_64/Intel support entirely,
    # since torch dropped that platform's wheels at 2.3.0 - PyTorch's own
    # announced, permanent decision), the numpy floor above stays <2-
    # compatible instead. 2.2.2 is the last release with wheels for every
    # platform amods supports (Linux/Windows/macOS, both Intel and Apple
    # Silicon) and every supported Python version.
    "torch>=2.2.2,<3",
    "denoiser>=0.1.5,<0.2",
    # ten_vad<1.0.6.5's wheel is mistagged py3-none-any but actually bundles
    # a Linux-only compiled .so - it fails to import at all on Windows/macOS.
    # 1.0.6.5 is the first release that properly bundles binaries for all
    # three platforms.
    "ten_vad>=1.0.6.5,<1.1",
    "silero-vad>=5.1,<7",
    # webrtcvad's C extension hard-codes WEBRTC_POSIX in its build and has
    # never published a Windows wheel across its entire version history - it
    # isn't written to compile there. Excluded on Windows; amods.models.vad
    # already imports it lazily and the "webrtc" VAD type just isn't
    # available there (use "silero" or "ten" instead).
    "webrtcvad>=2.0.7,<3; sys_platform != 'win32'",
    "onnxruntime>=1.18.0,<2",
]

[project.optional-dependencies]
gui = []
dev = ["pytest>=7.0,<10"]

[project.scripts]
amods = "amods.cli:main"
amods-gui = "amods.gui:main"
amods-latency = "amods.latency:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"amods.configs" = ["**/*.yaml"]
