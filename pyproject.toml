[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "amods"
version = "0.1.0"
description = "Adaptive Masking of Distracting Speech (AMODS)"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [
    { name = "Modan Tailleur" },
    { name = "Aine Drelingyte" },
    { name = "Mathieu Lagrange" },
    { name = "Romain Serizel" },
]
maintainers = [{ name = "Modan Tailleur", email = "modan.tailleur@gmail.com" }]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Topic :: Multimedia :: Sound/Audio",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "librosa>=0.10",
    "soundfile>=0.12",
    "sounddevice>=0.4",
    "PyYAML>=6.0",
    "torch>=2.0",
    "torchaudio>=2.0",
    "denoiser>=0.1.5",
    "ten_vad>=1.0.6",
    "silero-vad>=5.0",
    "webrtcvad>=2.0",
]

[project.optional-dependencies]
gui = []
dev = ["pytest>=7.0"]

[project.scripts]
amods = "amods.cli:main"
amods-gui = "amods.gui:main"
amods-latency = "amods.latency:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"amods.configs" = ["**/*.yaml"]
