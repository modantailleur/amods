[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "amods"
version = "0.1.3"
description = "Adaptive Masking of Distracting Speech (AMODS)"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = { file = "LICENSE" }
authors = [
    { name = "Modan Tailleur" },
    { name = "Aine Drelingyte" },
    { name = "Clara Boukhemia" },
    { name = "Mathieu Lagrange" },
    { name = "Romain Serizel" },
    { name = "Nicolas Misdariis" },
]
maintainers = [{ name = "Modan Tailleur", email = "modan.tailleur@gmail.com" }]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Topic :: Multimedia :: Sound/Audio",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "numpy>=2.0,<3",
    "librosa>=0.10,<0.12",
    "soundfile>=0.12.1,<0.14",
    "sounddevice>=0.4,<0.6",
    "PyYAML>=6.0,<7",
    "torch>=2.0,<3",
    "denoiser>=0.1.5,<0.2",
    "ten_vad>=1.0.6.3,<1.1",
    "silero-vad>=5.1,<7",
    "webrtcvad>=2.0.7,<3",
]

[project.optional-dependencies]
gui = []
dev = ["pytest>=7.0,<10"]

[project.scripts]
amods = "amods.cli:main"
amods-gui = "amods.gui:main"
amods-latency = "amods.latency:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"amods.configs" = ["**/*.yaml"]
