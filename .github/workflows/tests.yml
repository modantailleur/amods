name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    name: py${{ matrix.python-version }} / ${{ matrix.deps }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
        # "latest": whatever pip resolves as newest within pyproject.toml's
        # ranges (what a fresh `pip install amods` gets today).
        # "minimum": every dependency pinned to the lowest version its range
        # allows (constraints-min.txt), to prove that floor actually works
        # rather than being an unverified guess.
        deps: [latest, minimum]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # sounddevice needs PortAudio's shared library at import time, even
      # when no test actually opens a real audio stream. ten_vad's compiled
      # extension is linked against libc++ (LLVM's C++ runtime), which
      # Ubuntu doesn't install by default (it ships libstdc++ instead).
      - name: Install system libraries
        run: sudo apt-get update && sudo apt-get install -y libportaudio2 libc++1

      # --extra-index-url pulls CPU-only builds of torch/torchaudio. These
      # runners have no GPU, and the default PyPI wheels are CUDA-enabled:
      # torchaudio's compiled extension (imported transitively via
      # silero-vad) tries to dlopen the matching libcudart at import time
      # even when no GPU is ever used, which fails with no CUDA installed.
      - name: Install amods (latest allowed versions)
        if: matrix.deps == 'latest'
        run: pip install -e ".[dev]" --extra-index-url https://download.pytorch.org/whl/cpu

      - name: Install amods (minimum allowed versions)
        if: matrix.deps == 'minimum'
        run: pip install -e ".[dev]" -c constraints-min.txt --extra-index-url https://download.pytorch.org/whl/cpu

      - name: Run tests
        run: pytest -v
